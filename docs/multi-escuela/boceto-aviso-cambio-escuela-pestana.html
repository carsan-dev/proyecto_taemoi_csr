<title>Boceto · Aviso «Has cambiado de escuela» en las demás pestañas</title>
<!--
  Boceto (maqueta, no código de la app) de la capa que bloquea las DEMÁS pestañas de la app cuando una cuenta con
  varias escuelas cambia de escuela en una de ellas (selector aprobado en boceto-selector-escuela.html).

  Cuándo sale: la pestaña que cambia avisa al resto del mismo origen (BroadcastChannel «taemoi.cambioEscuela» o, sin
  él, el evento storage). Cada pestaña que lo recibe se queda con la memoria de la escuela anterior y la cookie de la
  nueva: deja de pedir nada a la API y se tapa con esta capa hasta recargar. Lógica ya hecha en la rama
  feat/f4-selector-escuela-panel: src-frontend/src/app/core/cambio-escuela-pestanas.ts (CambioEscuelaPestanasService,
  <dialog role=alertdialog> con showModal(), pintado sin Angular porque va en el bundle inicial). «Recargar» vacía el
  sessionStorage de la pestaña y hace una carga completa de /login/google, que lleva a cada uno a su sitio según sus
  roles en la escuela nueva (también desde la web pública: no se queda en la web).

  Comportamiento de la capa (igual en los tres sitios): no se cierra (ni Esc ni clic fuera; no hay X), el fondo queda
  oscurecido e inerte, el foco va al botón «Recargar» y no sale de la capa. role=alertdialog, aria-modal,
  aria-labelledby (título) y aria-describedby (frase). Botón de 44 px o más. Tras pulsar: «Recargando…» con el botón
  ocupado (aria-busy y aria-disabled, el foco se queda en él) y la frase en una región role=status.
  En el boceto la capa es un <div> y el fondo lleva inert (con showModal la barra «Probar» también quedaría inerte).

  Textos propuestos:
    Título: «Has cambiado de escuela»
    Con el nombre de la nueva: «Lo hiciste en otra pestaña. Recarga esta para seguir con los datos de
      Taekwondo Sierra Sur.»
    Sin el nombre: «Lo hiciste en otra pestaña. Recarga esta para seguir con los datos de la escuela nueva.»
    Botón: «Recargar» → «Recargando…»
  OJO: hoy el mensaje entre pestañas solo lleva {tipo: 'escuela-cambiada'}; para la variante con nombre tendría que
  llevar también el nombre de la escuela nueva. Sin él, la variante sin nombre es la que sale.

  De dónde sale cada estilo:
    1. Panel nuevo: diálogo del panel (panel-nuevo/dialogo/dialogo.component.scss y capas/_capas.scss; DESIGN.md
       «Diálogo y hoja»): 440 px, radio 8, sombra de diálogo, velo de la tinta al 40 %, título Montserrat Panel 700 de
       18 px, frase en tinta-2 con el nombre en negrita, botón principal de 40 px a la derecha. Por debajo de 768 px,
       hoja inferior (radio 14 arriba, botón de 44 px a ancho completo) sin asa ni X: no se puede deslizar ni cerrar.
       Propuesta: sin color de escuela (marca-por-defecto #1A2230, como el diálogo de peligro), porque la pestaña es de
       la escuela anterior y la capa habla de la nueva. Sin animación de entrada (DESIGN.md: solo se mueve lo que
       responde a una acción). Fondo: listado de Alumnos con la cabecera de Moi's Kim Do y datos inventados.
    2. Área de familias (vista-principal-user): sus avisos son SweetAlert2 11 sin personalizar, así que la capa copia
       su forma (caja blanca de 32em y radio 5 px, icono en anillo arriba, título de 1,875em en #545454, texto centrado,
       velo negro al 40 % y la entrada «swal2-show»), pero con la paleta del área: azul de «Mis clases» (#0d6efd en el
       anillo, #0a58ca de fondo del botón para llegar a 6:1 con el blanco) en lugar del morado por defecto de
       SweetAlert2 (anti-referencia). Montserrat 400/700 como el resto de pantallas de hoy. Fondo: cabecera de usuario
       (header.component, degradado #1b2b2e → #284747) y la tarjeta de bienvenida del área.
    3. Web pública de Moiskimdo (escaparate-principal y cabecera pública): caja blanca de radio 16 px y sombra
       $shadow-lg de la cabecera, el logo de la escuela arriba, Montserrat y botón en píldora (radio 50 px) en el
       oscuro de la marca (#1b2b2e), como los botones del hero. Entrada corta de opacidad y 8 px. Fondo: cabecera con
       «Volver al panel» (sesión del panel en la web) y el hero con su póster.
  Recursos: el logo, el póster, las fuentes del panel y Osaka se cargan del propio repo (../../src-frontend/src/assets);
  Montserrat 400/700 de Google Fonts, como la app y otros bocetos. Abrir el fichero desde docs/multi-escuela/.

  Barra «Probar» (o la URL): ?lugar=panel|familias|web&ancho=ventana|movil&nombre=si|no&estado=normal|recargando
    lugar   sitio de la pestaña bloqueada (por defecto panel)
    ancho   ventana = el ancho real del navegador; movil = un marco de 390 × 844 con la misma página
    nombre  si = la pestaña conoce la escuela nueva; no = variante sin nombre
    estado  normal = recién llegada la capa; recargando = tras pulsar «Recargar»
  Interno: &marco=1 es la página dentro del marco móvil (sin barra).
-->

/* =================================================================== 1. PANEL NUEVO (tokens de DESIGN.md bajo .pn) */
.pn{
  --pn-marca-primario:#1b2b2e;--pn-marca-sobre-primario:#fff;--pn-marca-sobre-primario-2:#c6cacb;--pn-marca-primario-tinta:#1b2b2e;--pn-marca-primario-suave:#e8eaea;
  --pn-marca-por-defecto:#1a2230;--pn-marca-suave-por-defecto:#e8e9ea;
  --pn-acento:#01707f;--pn-acento-borde:#4595a3;--pn-acento-suave:#d5f5fc;
  --pn-atencion:#a14f0b;--pn-atencion-suave:#fcf2e6;
  --pn-fondo:#f5f5f2;--pn-superficie:#fff;--pn-superficie-2:#fafaf8;--pn-linea:#e4e4df;--pn-linea-fuerte:#cfcfc8;--pn-borde-control:#868d97;
  --pn-tinta:#1a2230;--pn-tinta-2:#5d6573;--pn-tinta-3:#7a8290;--pn-bien:#2f6b3a;--pn-cinto-borde:#7a8290;
  --pn-fuente-titulo:"Montserrat Panel",montserrat,system-ui,sans-serif;--pn-fuente-cuerpo:"Public Sans","Segoe UI",system-ui,sans-serif;
  --pn-titulo-pantalla:700 1.5rem/1.15 var(--pn-fuente-titulo);--pn-titulo-bloque:700 1.0625rem/1.25 var(--pn-fuente-titulo);
  --pn-titulo-dialogo:700 1.125rem/1.3 var(--pn-fuente-titulo);
  --pn-cuerpo:400 .9375rem/1.45 var(--pn-fuente-cuerpo);--pn-secundario:400 .875rem/1.35 var(--pn-fuente-cuerpo);--pn-etiqueta:600 .8125rem/1.2 var(--pn-fuente-cuerpo);
  --pn-radio-s:6px;--pn-radio-m:8px;--pn-radio-carnet:14px;--pn-radio-pastilla:999px;
  --pn-sombra-barra:0 -6px 20px -8px rgb(26 34 48/22%),0 -2px 4px rgb(26 34 48/6%);
  --pn-sombra-dialogo:0 24px 48px -12px rgb(26 34 48/28%),0 4px 10px rgb(26 34 48/8%);
  --pn-sombra-hoja:0 -12px 32px -8px rgb(26 34 48/28%);
  --pn-velo:rgb(26 34 48/40%);--pn-transicion:150ms ease-out;
  background:var(--pn-fondo);color:var(--pn-tinta);font:var(--pn-cuerpo);-webkit-font-smoothing:antialiased;
}
.pn ::selection{background:var(--pn-acento-suave);color:var(--pn-tinta)}
.pn a:focus-visible,.pn button:focus-visible,.pn input:focus-visible{outline:3px solid var(--pn-acento-borde);outline-offset:2px}

.cab__fila{display:flex;align-items:center;gap:16px;height:100%;max-width:1280px;margin:0 auto;padding:0 24px}
.cab__marca{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.cab__logo{display:block;flex:none;width:46px;height:46px;border-radius:50%;background:#fff;object-fit:contain;padding:2px}
.cab__nombre{min-width:0;font:var(--pn-titulo-bloque);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab__nav{display:none;margin-left:auto}
.cab__nav ul{display:flex;gap:2px;margin:0;padding:0;list-style:none}
.cab__nav a{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:var(--pn-radio-m);color:var(--pn-marca-sobre-primario-2);font:600 .875rem/1 var(--pn-fuente-cuerpo);text-decoration:none;white-space:nowrap}
.cab__nav a[aria-current=page]{background:rgb(255 255 255/14%);color:var(--pn-marca-sobre-primario)}
.cab__cuenta{display:flex;flex:none;align-items:center;gap:8px;margin-left:auto;font:600 .875rem/1 var(--pn-fuente-cuerpo)}
.cab__nav+.cab__cuenta{margin-left:8px}
.cab__avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pn-acento-suave);color:var(--pn-acento);font:700 .8125rem/1 var(--pn-fuente-cuerpo)}
.cab__cuenta-nombre{display:none}
@media (min-width:1024px){.cab__nav{display:block}}
@media (min-width:1024px) and (max-width:1219.98px){.cab__nombre{display:none}}
@media (min-width:1280px){.cab__cuenta-nombre{display:inline}}
@media (max-width:767.98px){.cab{height:56px}.cab__fila{padding:0 16px;gap:12px}.cab__logo{width:40px;height:40px}.cab__nombre{font-size:1rem}}

.pagina{max-width:1280px;margin:0 auto;padding:24px 24px 96px}
.pagina h1{margin:0;font:var(--pn-titulo-pantalla);letter-spacing:-.01em}
.pagina__cabeza{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}

.btn-pn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:var(--pn-radio-m);background:var(--pn-marca-primario-tinta);color:#fff;font:var(--pn-etiqueta);font-size:.875rem;white-space:nowrap;cursor:pointer}
.herramientas{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.buscador{position:relative;flex:1 1 280px;max-width:420px}

.buscador input{width:100%;min-height:42px;padding:0 12px 0 38px;border:1px solid var(--pn-borde-control);border-radius:var(--pn-radio-m);background:var(--pn-superficie);color:var(--pn-tinta);font:var(--pn-cuerpo)}

.filtros{display:flex;flex-wrap:wrap;gap:8px}
.filtro{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--pn-borde-control);border-radius:var(--pn-radio-pastilla);background:var(--pn-superficie);color:var(--pn-tinta);font:var(--pn-etiqueta)}
.filtro[aria-pressed=true]{border-color:var(--pn-acento-borde);background:var(--pn-acento-suave);color:var(--pn-acento)}
.lista-al{margin:0;padding:0;list-style:none;border:1px solid var(--pn-linea);border-radius:var(--pn-radio-m);background:var(--pn-superficie);overflow:hidden}
.lista-al li+li{border-top:1px solid var(--pn-linea)}
.fila{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 12px 10px 16px}
.foto{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pn-marca-primario-suave);color:var(--pn-tinta-2);font:700 .8125rem/1 var(--pn-fuente-cuerpo)}
.fila__l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.fila__nombre{color:var(--pn-acento);font-weight:600;text-decoration:none}
.fila__meta{font:var(--pn-secundario);color:var(--pn-tinta-2);font-variant-numeric:tabular-nums}
.fila__l2{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;margin-top:2px;font:var(--pn-secundario);color:var(--pn-tinta-2)}
.disc{display:inline-flex;align-items:center;gap:6px}

.fila__dcha{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.importe{font:600 .9375rem/1 var(--pn-fuente-cuerpo);color:var(--pn-atencion);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-texto{display:inline-flex;align-items:center;min-height:34px;padding:0 10px;border:0;border-radius:var(--pn-radio-m);background:none;color:var(--pn-acento);font:600 .875rem/1 var(--pn-fuente-cuerpo);cursor:pointer}
.al-dia{display:inline-flex;align-items:center;gap:4px;font:var(--pn-secundario);color:var(--pn-bien)}

.nav-inferior{position:fixed;inset:auto 0 0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);height:64px;margin:0;padding:0;list-style:none;background:var(--pn-superficie);box-shadow:var(--pn-sombra-barra)}

@media (max-width:767.98px){

/* --- Capa del panel: diálogo del panel; hoja inferior por debajo de 768. Sin color de escuela (marca-por-defecto). */
.capa{position:fixed;inset:var(--bb-alto,0px) 0 0;z-index:150;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;overflow-y:auto}
.capa-pn{
  --pn-marca-primario-tinta:var(--pn-marca-por-defecto);--pn-marca-primario-suave:var(--pn-marca-suave-por-defecto);
  --pn-acento-borde:#6f8abb;
  background:var(--pn-velo)}
.dlg-pn{width:440px;max-width:calc(100vw - 32px);border-radius:var(--pn-radio-m);background:var(--pn-superficie);color:var(--pn-tinta);box-shadow:var(--pn-sombra-dialogo)}
.dlg-pn__titulo{margin:0;padding:24px 24px 0;font:var(--pn-titulo-dialogo);color:var(--pn-tinta);text-wrap:balance}
.dlg-pn__mensaje{margin:0;padding:8px 24px 0;color:var(--pn-tinta-2);max-width:60ch;text-wrap:pretty}
.dlg-pn__mensaje strong{color:var(--pn-tinta);font-weight:600}
.dlg-pn__pie{display:flex;justify-content:flex-end;padding:24px}
.dlg-pn__accion{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:120px;min-height:44px;padding:0 18px;border:0;border-radius:var(--pn-radio-m);background:var(--pn-marca-primario-tinta);color:var(--pn-marca-sobre-primario);font:600 .9375rem/1 var(--pn-fuente-cuerpo);cursor:pointer;transition:background-color var(--pn-transicion)}
.dlg-pn__accion:hover:not([aria-disabled=true]){background:color-mix(in srgb,var(--pn-marca-primario-tinta) 86%,#000)}
.dlg-pn__accion:focus-visible{outline:3px solid var(--pn-acento-borde);outline-offset:2px}
.dlg-pn__accion[aria-disabled=true]{cursor:progress;color:#c6c8cb}
@media (max-width:767.98px){
  .capa-pn{align-items:end;padding:0}
  .dlg-pn{width:100%;max-width:100%;border-radius:var(--pn-radio-carnet) var(--pn-radio-carnet) 0 0;box-shadow:var(--pn-sombra-hoja);padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px))}

  .dlg-pn__pie{padding:24px 0 0}
  .dlg-pn__accion{width:100%}
}

    const entradas = [['inicio', 'Inicio'], ['alumnos', 'Alumnos', true], ['grupos', 'Grupos'], ['tesoreria', 'Tesorería'], ['solicitudes', 'Solicitudes'], ['escuela', 'Escuela']];
    const filas = ALUMNOS.map((a) => `<li class="fila">
        <span class="foto" aria-hidden="true">${iniciales(a.n)}</span>
        <div>
          <div class="fila__l1"><a class="fila__nombre" href="#">${a.n}</a><span class="fila__meta">Nº ${a.exp} · ${a.edad} años</span></div>
          <div class="fila__l2">${a.disc.map(([c, t]) => `<span class="disc">${c ? `<span class="cinto" style="background:${c}" aria-hidden="true"></span>` : ''}${t}</span>`).join('')}<span>${a.tarifa}</span></div>
        </div>
        <div class="fila__dcha">${a.pend ? `<span class="importe">${euros(a.pend)}</span><button type="button" class="btn-texto">Cobrar</button>` : `<span class="al-dia">${ico('check')}Al día</span>`}</div>
      </li>`).join('');
    return `<div class="pn">
      <header class="cab"><div class="cab__fila">
        <a class="cab__marca" href="#"><img class="cab__logo" src="${LOGO}" alt="Logo de Moi's Kim Do"><span class="cab__nombre">Moi's Kim Do</span></a>
        <nav class="cab__nav" aria-label="Principal"><ul>${entradas.map(([i, t, act]) => `<li><a href="#"${act ? ' aria-current="page"' : ''}>${ico(i)}${t}</a></li>`).join('')}</ul></nav>
        <span class="cab__cuenta"><span class="cab__avatar" aria-hidden="true">AL</span><span class="cab__cuenta-nombre">Ana López</span><span class="oculto">Cuenta de Ana López</span></span>
      </div></header>
      <main class="pagina">
        <div class="pagina__cabeza">
          <div><h1>Alumnos</h1><p class="pagina__sub">112 activos · 834 en total</p></div>
          <button type="button" class="btn-pn">${ico('mas')}Nuevo alumno</button>
        </div>
        <div class="herramientas">
          <label class="buscador">${ico('buscar')}<span class="oculto">Buscar alumno</span><input type="search" placeholder="Buscar por nombre o nº de expediente"></label>
          <div class="filtros"><button type="button" class="filtro" aria-pressed="true">Activos</button><button type="button" class="filtro" aria-pressed="false">Con pendiente</button><button type="button" class="filtro" aria-pressed="false">Disciplina${ico('abajo')}</button></div>
        </div>
        <ul class="lista-al">${filas}</ul>
      </main>
      <nav aria-label="Principal (móvil)"><ul class="nav-inferior">
        <li><a href="#">${ico('inicio')}Inicio</a></li>
        <li><a href="#" aria-current="page">${ico('alumnos')}Alumnos</a></li>
        <li><a href="#">${ico('tesoreria')}Tesorería</a></li>
        <li><a href="#">${ico('masmenu')}Más</a></li>
      </ul></nav>
    </div>`;
  }

  function cabeceraVieja(dcha, actual) {
    const nav = [['inicio', 'Inicio'], ['trofeo', '¿Qué hacemos?'], ['calendario', 'Eventos'], ['reloj', 'Horarios'], ['euro', 'Tarifas'], ['chat', 'Contacto']];
    return `<header class="hd"><div class="hd__fila">
      <span class="hd__movil"><button type="button" class="hd__menu" aria-label="Abrir menú de navegación">${ico('masmenu')}</button><img class="hd__logo-m" src="${LOGO}" alt="Logo de Moi's Kim Do"><span class="hd__titulo"><b><span>MOI'S</span> <span>KIM DO</span></b><small>ESCUELA DE ARTES MARCIALES</small></span></span>
      <img class="hd__logo" src="${LOGO}" alt="Logo de Moi's Kim Do">
      <ul class="hd__nav">${nav.map(([i, t]) => `<li><a href="#"${t === actual ? ' aria-current="page"' : ''}>${ico(i)}${t}</a></li>`).join('')}</ul>
      <div class="hd__dcha"><a class="hd__social" href="#" aria-label="Instagram">${ico('social')}</a>${dcha}</div>
    </div></header>`;
  }

  function fondoFamilias() {
    return `<div class="vieja">${cabeceraVieja('<span class="hd__usuario"><span class="hd__inic" aria-hidden="true">AL</span><span>Ana López</span></span>', '')}
      <main class="fa"><div class="fa__marco">
        <section class="fa__hero">
          <div class="fa__hero-fila">
            <div><span class="fa__cejilla">${ico('estrellas')}Área de alumnos</span><h1 class="fa__titulo">Bienvenido/a</h1><p class="fa__sub">${ico('persona')}Lucía Romero Gil</p></div>
            <div class="fa__acciones"><button type="button" class="fa__btn fa__btn--prim">${ico('play')}Mis clases</button><button type="button" class="fa__btn">${ico('documento')}Mis documentos</button><button type="button" class="fa__btn">${ico('calendario')}Ver horarios</button></div>
          </div>
          <div class="fa__cifras">
            <div class="fa__cifra"><span class="fa__cifra-ico">${ico('grupos')}</span><div><b>2</b><span>Grupos activos</span></div></div>
            <div class="fa__cifra"><span class="fa__cifra-ico">${ico('trofeo')}</span><div><b>1</b><span>Deportes inscritos</span></div></div>
            <div class="fa__cifra"><span class="fa__cifra-ico">${ico('check')}</span><div><b>1</b><span>Aptos para examen</span></div></div>
            <div class="fa__cifra"><span class="fa__cifra-ico">${ico('documento')}</span><div><b>3</b><span>Documentos</span></div></div>
          </div>
        </section>
        <div class="fa__tarjetas">
          <section class="fa__tarjeta"><h2>Próxima clase</h2><span class="fa__dia">Hoy</span><span class="fa__hora">17:00 – 18:00</span><p>Taekwondo infantil · Umbrete</p></section>
          <section class="fa__tarjeta"><h2>Próximo examen</h2><p>Convocatoria de diciembre. Lucía ya puede presentarse a 7.º gup.</p></section>
        </div>
      </div></main></div>`;
  }

  function fondoWeb() {
    return `<div class="vieja wb">${cabeceraVieja(`<a class="hd__boton" href="#">${ico('volver')}Volver al panel</a>`, 'Inicio')}
      <main class="wb__hero"><div class="wb__contenido">
        <span class="wb__insignia">${ico('insignia')}Más de 15 años de experiencia</span>
        <h1 class="wb__titulo"><span>MOI'S KIM DO</span><span>UMBRETE</span></h1>
        <p class="wb__sub">Artes marciales en Umbrete, Sevilla</p>
        <p class="wb__desc">Transforma tu vida a través de las artes marciales</p>
        <div class="wb__botones"><button type="button" class="wb__btn">${ico('calendario')}Ver horarios</button><button type="button" class="wb__btn wb__btn--sec">${ico('persona')}Inscríbete ahora</button></div>
      </div></main></div>`;
  }

  // ------------------------------------------------------------ capas
  function capa() {
    const ocupado = s.estado === 'recargando';
    const aria = `role="alertdialog" aria-modal="true" aria-labelledby="capa-titulo" aria-describedby="capa-texto"`;
    const boton = (cls) => `<button type="button" class="${cls}" id="capa-recargar"${ocupado ? ' aria-disabled="true" aria-busy="true"' : ''}>${contenidoBoton(ocupado)}</button>`;
    const voz = `<p class="oculto" role="status" id="capa-voz">${ocupado ? 'Recargando…' : ''}</p>`;
    if (s.lugar === 'panel') {
      return `<div class="capa capa-pn pn" id="capa"><div class="dlg-pn" ${aria} id="dlg">
        <h2 class="dlg-pn__titulo" id="capa-titulo">${TITULO}</h2>
        <p class="dlg-pn__mensaje" id="capa-texto">${frase()}</p>
        <div class="dlg-pn__pie">${boton('dlg-pn__accion')}</div>${voz}
      </div></div>`;
    }
    if (s.lugar === 'familias') {
      return `<div class="capa capa-fa vieja" id="capa"><div class="dlg-fa" ${aria} id="dlg">
        <div class="dlg-fa__icono" aria-hidden="true">${ico('recargar')}</div>
        <h2 class="dlg-fa__titulo" id="capa-titulo">${TITULO}</h2>
        <p class="dlg-fa__texto" id="capa-texto">${frase()}</p>
        <div class="dlg-fa__acciones">${boton('dlg-fa__accion')}</div>${voz}
      </div></div>`;
    }
    return `<div class="capa capa-wb vieja" id="capa"><div class="dlg-wb" ${aria} id="dlg">
      <img class="dlg-wb__logo" src="${LOGO}" alt="">
      <h2 class="dlg-wb__titulo" id="capa-titulo">${TITULO}</h2>
      <p class="dlg-wb__texto" id="capa-texto">${frase()}</p>
      ${boton('dlg-wb__accion')}${voz}
    </div></div>`;
  }

  function engancharCapa() {
    const b = $('capa-recargar');
    // Pulsar «Recargar»: botón ocupado (aria-disabled, no disabled: el foco se queda) y aviso a los lectores.
    b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      s.estado = 'recargando';
      b.setAttribute('aria-disabled', 'true'); b.setAttribute('aria-busy', 'true');
      b.innerHTML = contenidoBoton(true);
      $('capa-voz').textContent = '';
      setTimeout(() => { $('capa-voz').textContent = 'Recargando…'; }, 100);
      if (!enMarco) { pintarBarra(); history.replaceState(null, '', params()); }
    });
    // No se cierra: Esc no hace nada; Tab no sale de la capa (único control: el botón); el clic fuera, nada.
    $('dlg').addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') ev.preventDefault();
      if (ev.key === 'Tab') { ev.preventDefault(); b.focus(); }
    });
    $('capa').addEventListener('mousedown', (ev) => { if (!ev.target.closest('#capa-recargar')) { ev.preventDefault(); b.focus(); } });
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') ev.preventDefault(); });
    b.focus({ preventScroll: true });
  }

  // ------------------------------------------------------------ barra «Probar»
  function pintarBarra() {
    if (enMarco) { $('bb').hidden = true; return; }
    [['bb-lugar', LUGARES, 'lugar'], ['bb-ancho', ANCHOS, 'ancho'], ['bb-nombre', NOMBRES, 'nombre'], ['bb-estado', ESTADOS, 'estado']].forEach(([id, lista, k]) => {
      const g = $(id); g.querySelectorAll('button').forEach((b) => b.remove());
      lista.forEach(([v, t]) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
        b.setAttribute('aria-pressed', String(s[k] === v));
        b.addEventListener('click', () => { s[k] = v; history.replaceState(null, '', params()); pintar(); });
        g.appendChild(b);
      });
    });
    const donde = { panel: 'Panel nuevo: hoja inferior por debajo de 768 px.', familias: 'Área de familias: forma de sus SweetAlert2, con su azul.', web: 'Web pública: «Recargar» lleva a la entrada de la sesión, no se queda en la web.' }[s.lugar];
    $('bb-nota').textContent = `${donde} La capa no se cierra con Esc ni con clic fuera; pulsa «Recargar» para ver «Recargando…».`;
  }

  function pintar() {
    pintarBarra();
    if (s.ancho === 'movil' && !enMarco) {
      $('raiz').innerHTML = `<div class="marco-fondo"><p>Móvil · 390 × 844</p><iframe class="marco" title="Pestaña bloqueada en un móvil de 390 px" src="${params({ marco: '1' })}"></iframe></div>`;
      return;
    }
    const fondo = { panel: fondoPanel, familias: fondoFamilias, web: fondoWeb }[s.lugar]();
    $('raiz').innerHTML = `<div class="escena" inert aria-hidden="true">${fondo}</div>${capa()}`;
    engancharCapa();
    medirBarra();
  }

  // La barra «Probar» no es de la pantalla: la capa empieza debajo de ella para no taparla.
  function medirBarra() {
    document.documentElement.style.setProperty('--bb-alto', enMarco ? '0px' : $('bb').offsetHeight + 'px');
  }
  addEventListener('resize', medirBarra);

  pintar();
})();
</script>
</body>
</html>
