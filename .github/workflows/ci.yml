name: CI

env:
  GHCR_NAMESPACE: carsan-dev

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src-api/pom.xml

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Create Chrome wrapper for CI
        run: |
          printf '%s\n' '#!/usr/bin/env bash' "exec \"$CHROME_PATH\" --no-sandbox --disable-setuid-sandbox \"\$@\"" > ./chrome-no-sandbox
          chmod +x ./chrome-no-sandbox
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CHROME_BIN: ${{ github.workspace }}/src-frontend/chrome-no-sandbox
        run: npm test -- --watch=false --browsers=ChromeHeadlessStable

      - name: Build frontend for production
        run: npm run build:production

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_ADMIN_EMAIL: e2e-admin@taemoi.test
      E2E_ADMIN_PASSWORD: E2e-Scroll-Only-2026!
    defaults:
      run:
        working-directory: src-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start disposable E2E backend and MySQL
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.e2e.yml up --build --detach --wait --wait-timeout 300

      - name: Verify disposable admin login
        run: |
          status="$(curl --silent --show-error \
            --output /tmp/e2e-login-response.json \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${E2E_ADMIN_EMAIL}\",\"contrasena\":\"${E2E_ADMIN_PASSWORD}\",\"rememberMe\":false}" \
            http://localhost:8080/api/auth/signin)"
          if [ "$status" != "200" ]; then
            echo "El login del administrador E2E devolvió HTTP $status"
            cat /tmp/e2e-login-response.json
            exit 1
          fi

      - name: Run desktop and mobile E2E journeys
        run: npm run test:e2e

      - name: Show E2E container diagnostics on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.e2e.yml ps --all || true
          docker compose -f docker-compose.e2e.yml logs --no-color --timestamps database backend || true

      - name: Preserve Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            src-frontend/playwright-report
            src-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove disposable E2E volumes
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

  publish-images:
    needs:
      - backend-tests
      - frontend-tests
      - e2e
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./src-api
            file: ./src-api/Dockerfile
          - name: frontend
            context: ./src-frontend
            file: ./src-frontend/Dockerfile.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_NAMESPACE }}/taemoi-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
