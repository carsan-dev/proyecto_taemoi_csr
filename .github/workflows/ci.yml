name: CI

env:
  GHCR_NAMESPACE: carsan-dev

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src-api/pom.xml

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress test

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Create Chrome wrapper for CI
        run: |
          printf '%s\n' '#!/usr/bin/env bash' "exec \"$CHROME_PATH\" --no-sandbox --disable-setuid-sandbox \"\$@\"" > ./chrome-no-sandbox
          chmod +x ./chrome-no-sandbox
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CHROME_BIN: ${{ github.workspace }}/src-frontend/chrome-no-sandbox
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend for production
        run: npm run build:production

  publish-images:
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./src-api
            file: ./src-api/Dockerfile
          - name: frontend
            context: ./src-frontend
            file: ./src-frontend/Dockerfile.production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.GHCR_NAMESPACE }}/taemoi-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
