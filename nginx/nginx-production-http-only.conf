user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Brotli compression (mejor compresión que gzip ~15-20%)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 429 y no el 503 por defecto: el exceso de peticiones no debe parecer una caída del servicio.
    limit_req_status 429;

    # X-Robots-Tag: noindex en /api y en las rutas privadas del SPA (las de app.routes.ts con guard de sesión, más las
    # pantallas de enlace con token). Es un map sobre $request_uri y no un add_header por location porque try_files
    # reenvía internamente a /index.html y la respuesta sale de la location de index.html, no de la de la ruta privada.
    # Se manda desde cabeceras-seguridad.conf, así que llega a toda respuesta que incluya ese fichero. Valor vacío = sin cabecera.
    # Las rutas públicas (portada, sedes, horarios, tarifas, eventos, contacto, preinscripción, legales) no la llevan.
    map $request_uri $robots_privado {
        default "";
        ~*^/api(/|$|\?) "noindex, nofollow, noarchive";
        ~*^/(?!login/oauth2/)(login|recuperar-contrasena|reset-password|registro-confirmar|adminpage|userpage|alumnos[^/]*|grupos[^/]*|gestionarAlumnos[^/]*|seleccionarAlumnos[^/]*|gestionarTurnosAlumno[^/]*|turnos(Crear|Editar)|eventos(Listar|Crear|Editar)|productos(Listar|Crear|Editar)|convocatoriasListar|configuracion-sistema|crear-contrasena|preinscripciones|tesoreriaCobros|cajaSede|solicitudes|auditoriaSistema|panel/diseno-nuevo|plataformaErrores|plataformaLogos|mi-caja|mis-grupos)(/|$|\?) "noindex, nofollow, noarchive";
    }

    # Upstream backend service
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # Main HTTP server
    server {
        listen 80;
        listen [::]:80;
        server_name moiskimdo.es www.moiskimdo.es;

        # Root directory for Angular static files
        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad (HSTS, X-Frame-Options, nosniff, Referrer-Policy y CSP): ver el fichero incluido.
        # Cada location con add_header propio vuelve a incluirlo, porque si no nginx no hereda estas.
        include /etc/nginx/cabeceras-seguridad.conf;

        # Private SPA routes should never be indexed
        # Exclude OAuth callback path (/login/oauth2/) from this matcher.
        location ~* ^/(?!login/oauth2/)(login|recuperar-contrasena|reset-password|registro-confirmar|adminpage|userpage|alumnos[^/]*|grupos[^/]*|gestionarAlumnos[^/]*|seleccionarAlumnos[^/]*|gestionarTurnosAlumno[^/]*|turnos(Crear|Editar)|eventos(Listar|Crear|Editar)|productos(Listar|Crear|Editar)|convocatoriasListar|configuracion-sistema|crear-contrasena|preinscripciones|tesoreriaCobros|cajaSede|solicitudes|auditoriaSistema|panel/diseno-nuevo|plataformaErrores|plataformaLogos|mi-caja|mis-grupos)(/|$) {
            include /etc/nginx/cabeceras-seguridad.conf;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        }

        # Event image endpoint - avoid proxy buffering issues on concurrent loads
        location ~* ^/api/eventos/[0-9]+/imagen$ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Stream directly to the client to avoid truncation under load
            proxy_buffering off;
            proxy_request_buffering off;

            # Retry automático en errores temporales
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # API proxy to Spring Boot backend
        # Document download endpoints - stream directly to avoid truncation/reset issues
        location ~* ^/api/(alumnos/[0-9]+/documentos/[0-9]+/descargar|eventos/[0-9]+/documentos/[0-9]+/descargar)$ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            gzip off;
            brotli off;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Login endpoint with stricter rate limiting
        location /api/auth/signin {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth2 authorization endpoints
        location /oauth2/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # OAuth2 requires redirect handling
            proxy_redirect off;
        }

        # OAuth2 callback endpoint
        location /login/oauth2/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # OAuth2 requires redirect handling
            proxy_redirect off;
        }

        # Serve images from backend (proxied to Spring Boot)
        location /imagenes/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream large files directly to avoid temp file buffering
            proxy_buffering off;

            # Sin cabeceras de caché propias: manda el backend (public 1h para imágenes públicas,
            # "private, no-store" para fotos de alumnos). No añadir expires/Cache-Control aquí.
        }

        # Serve documents from backend (proxied to Spring Boot)
        location /documentos/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream large files directly to avoid temp file buffering
            proxy_buffering off;

            # No caching for documents (security). Se oculta la del backend para que Cache-Control llegue una sola vez.
            proxy_hide_header Cache-Control;
            include /etc/nginx/cabeceras-seguridad.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Angular static files
        location / {
            try_files $uri $uri/ /index.html;

            # Ensure .mjs is served as JavaScript modules (some nginx images map it to octet-stream)
            location ~* \.mjs$ {
                try_files $uri =404;
                default_type application/javascript;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "public, max-age=3600";
                access_log off;
            }

            # panel-nuevo.css se compila sin hash (angular.json, inject: false): no puede ser immutable. Se revalida con
            # ETag/Last-Modified en cada carga y un cambio de tokens llega sin esperar a que caduque la caché.
            location = /panel-nuevo.css {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache";
            }

            # gestion-compartida.css se compila sin hash (angular.json, inject: false): no puede ser immutable. Se revalida con
            # ETag/Last-Modified en cada carga y un cambio de estilos llega sin esperar a que caduque la caché.
            location = /gestion-compartida.css {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache";
            }

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webm|mp4|avif)$ {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }

            # Don't cache index.html
            location = /index.html {
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache, must-revalidate, max-age=0";
            }
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            default_type text/plain;
        }
    }
}
