user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log format detallado para debugging de timeouts WiFi
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log detailed;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts extendidos para conexiones WiFi inestables
    keepalive_timeout 300;
    keepalive_requests 1000;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    # Reset timedout connection para limpiar conexiones muertas
    reset_timedout_connection on;

    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Brotli compression (mejor compresión que gzip ~15-20%)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 429 y no el 503 por defecto: el exceso de peticiones no debe parecer una caída del servicio.
    limit_req_status 429;

    # X-Robots-Tag: noindex en /api y en las rutas privadas del SPA (las de app.routes.ts con guard de sesión, más las
    # pantallas de enlace con token). Es un map sobre $request_uri y no un add_header por location porque try_files
    # reenvía internamente a /index.html y la respuesta sale de la location de index.html, no de la de la ruta privada.
    # Se manda desde cabeceras-seguridad.conf, así que llega a toda respuesta que incluya ese fichero. Valor vacío = sin cabecera.
    # Las rutas públicas (portada, sedes, horarios, tarifas, eventos, contacto, preinscripción, legales) no la llevan.
    map $request_uri $robots_privado {
        default "";
        ~*^/api(/|$|\?) "noindex, nofollow, noarchive";
        ~*^/(?!login/oauth2/)(login|recuperar-contrasena|reset-password|registro-confirmar|adminpage|userpage|alumnos[^/]*|grupos[^/]*|gestionarAlumnos[^/]*|seleccionarAlumnos[^/]*|gestionarTurnosAlumno[^/]*|turnos(Crear|Editar)|eventos(Listar|Crear|Editar)|productos(Listar|Crear|Editar)|convocatoriasListar|configuracion-sistema|crear-contrasena|preinscripciones|tesoreriaCobros|cajaSede|solicitudes|auditoriaSistema|panel/diseno-nuevo|plataformaErrores|plataformaLogos|mi-caja|mis-grupos|material-examen)(/|$|\?) "noindex, nofollow, noarchive";
    }

    # Upstream backend service
    # Toda location con proxy_pass a backend debe fijar Host, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto,
    # X-Forwarded-For y X-Real-IP, y vaciar Forwarded y X-Forwarded-Prefix: la API (forward-headers-strategy=framework)
    # resuelve la escuela por el Host y cree estas cabeceras. Forwarded (RFC 7239) manda sobre X-Forwarded-Host: si
    # no se vacía, el host lo elige el cliente.
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint (for Docker healthcheck)
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS con un nombre no declarado (por IP, sin SNI o con otro dominio): se corta sin certificado. Sin este bloque,
    # el servidor por defecto de 443 sería el primero declarado (www). ssl_reject_handshake necesita nginx 1.19.4 o
    # posterior; el return 444 cubre una petición cuyo Host no coincide con el SNI negociado.
    # En el 80 no hay equivalente a propósito: el healthcheck del contenedor (curl http://localhost/health) entra
    # con Host localhost por el server_name _ de arriba, y del healthcheck dependen certbot y el atajo comprobar.
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        ssl_reject_handshake on;

        return 444;
    }

    # Redirect www to non-www (HTTPS)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.moiskimdo.es;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/moiskimdo.es/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/moiskimdo.es/privkey.pem;

        # La HSTS no lleva includeSubDomains, así que www necesita la suya; el resto de cabeceras, por coherencia.
        include /etc/nginx/cabeceras-seguridad.conf;

        # Redirect to non-www
        return 301 https://moiskimdo.es$request_uri;
    }

    # Main HTTPS server (non-www)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name moiskimdo.es;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/moiskimdo.es/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/moiskimdo.es/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/moiskimdo.es/chain.pem;

        # TLS (Mozilla Modern), sesión y OCSP stapling: comunes con los hosts de escuela. Ver el fichero incluido.
        include /etc/nginx/ssl-comun.conf;

        # Cabeceras de seguridad (HSTS, X-Frame-Options, nosniff, Referrer-Policy y CSP): ver el fichero incluido.
        # Cada location con add_header propio vuelve a incluirlo, porque si no nginx no hereda estas.
        include /etc/nginx/cabeceras-seguridad.conf;

        # Root directory for Angular static files
        root /usr/share/nginx/html;
        index index.html;

        # Redirect legacy home path to root
        location = /inicio {
            return 301 /;
        }
        location = /inicio/ {
            return 301 /;
        }
        location = /aljarafe/ {
            return 301 /aljarafe;
        }
        location = /sevilla/ {
            return 301 /sevilla;
        }

        # index-plantilla.html es la entrada de la web por plantilla de los hosts de escuela (nginx/escuelas/): en
        # moiskimdo.es no se sirve.
        location = /index-plantilla.html {
            return 404;
        }

        # Private SPA routes should never be indexed
        # Exclude OAuth callback path (/login/oauth2/) from this matcher.
        location ~* ^/(?!login/oauth2/)(login|recuperar-contrasena|reset-password|registro-confirmar|adminpage|userpage|alumnos[^/]*|grupos[^/]*|gestionarAlumnos[^/]*|seleccionarAlumnos[^/]*|gestionarTurnosAlumno[^/]*|turnos(Crear|Editar)|eventos(Listar|Crear|Editar)|productos(Listar|Crear|Editar)|convocatoriasListar|configuracion-sistema|crear-contrasena|preinscripciones|tesoreriaCobros|cajaSede|solicitudes|auditoriaSistema|panel/diseno-nuevo|plataformaErrores|plataformaLogos|mi-caja|mis-grupos|material-examen)(/|$) {
            include /etc/nginx/cabeceras-seguridad.conf;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        }

        # Locations comunes con los hosts de escuela: proxy a la API (/api/, /oauth2/, /login/oauth2/, /imagenes/,
        # /documentos/...), ficheros ocultos y /health. Va aquí para conservar el orden de las regex.
        include /etc/nginx/app-locations.conf;

        # Angular static files
        location / {
            try_files $uri $uri/ /index.html;

            # Ensure .mjs is served as JavaScript modules (some nginx images map it to octet-stream)
            location ~* \.mjs$ {
                try_files $uri =404;
                default_type application/javascript;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "public, max-age=3600";
                access_log off;
            }

            # panel-nuevo.css se compila sin hash (angular.json, inject: false): no puede ser immutable. Se revalida con
            # ETag/Last-Modified en cada carga y un cambio de tokens llega sin esperar a que caduque la caché.
            location = /panel-nuevo.css {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache";
            }

            # gestion-compartida.css se compila sin hash (angular.json, inject: false): no puede ser immutable. Se revalida con
            # ETag/Last-Modified en cada carga y un cambio de estilos llega sin esperar a que caduque la caché.
            location = /gestion-compartida.css {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache";
            }

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webm|mp4|avif)$ {
                try_files $uri =404;
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }

            # Don't cache index.html
            location = /index.html {
                include /etc/nginx/cabeceras-seguridad.conf;
                add_header Cache-Control "no-cache, must-revalidate, max-age=0";
            }
        }
    }

    # Hosts de escuela con certificado: el entrypoint (nginx-cert-reloader) copia aquí cada nginx/escuelas/<dominio>.conf
    # solo si existe /etc/letsencrypt/live/<dominio>/ y nginx -t lo acepta. Vacío = solo moiskimdo.es.
    include /etc/nginx/escuelas-activas/*.conf;
}
