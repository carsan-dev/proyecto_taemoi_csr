# Locations comunes a moiskimdo.es y a los hosts de escuela (nginx/escuelas/). Se incluye dentro de un server 443.
# Nada de aquí sirve index.html ni index-plantilla.html: lo que depende del fichero de entrada se queda en cada server.
# Las location regex se evalúan en el orden en que aparecen tras expandir el include: este fichero va justo después de
# la regex de rutas privadas de moiskimdo.es y antes de su location /, y debe acabar con ~ /\. (la última regex hoy).
# Toda location con proxy_pass fija Host, X-Forwarded-Host, X-Forwarded-Port, X-Forwarded-Proto, X-Forwarded-For y
# X-Real-IP, y vacía Forwarded y X-Forwarded-Prefix (ver el comentario del upstream en nginx-production.conf).

        # Event image endpoint - avoid proxy buffering issues on concurrent loads
        location ~* ^/api/eventos/[0-9]+/(imagen|fotos/[0-9]+)$ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive connection con backend
            proxy_set_header Connection "";

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts extendidos para WiFi
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Stream directly to the client to avoid truncation under load
            proxy_buffering off;
            proxy_request_buffering off;

            # Retry automático en errores temporales
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # API proxy to Spring Boot backend
        # Document download endpoints - stream directly to avoid HTTP/2 truncation/reset issues
        location ~* ^/api/(alumnos/[0-9]+/documentos/[0-9]+/descargar|eventos/[0-9]+/documentos/[0-9]+/descargar)$ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive connection con backend
            proxy_set_header Connection "";

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts extendidos para WiFi
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Stream directly to client to avoid buffering/protocol issues
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            # Avoid content-encoding transformations on binary downloads
            gzip off;
            brotli off;

            # Retry automÃ¡tico en errores temporales
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Material de examen (temario/documentos/videos) - stream directly to avoid HTTP/2 reset/truncation issues
        location ~* ^/api/alumnos/[0-9]+/deportes/[^/]+/material-examen/(temario|documentacion/[^/?]+|videos/[^/?]+)$ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive connection con backend
            proxy_set_header Connection "";

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Accept-Encoding "";

            # Timeouts extendidos para WiFi
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Stream directly to client to avoid buffering/protocol issues
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;

            # Avoid content-encoding transformations on binary content
            gzip off;
            brotli off;

            # Retry automático en errores temporales
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Material de examen del panel (pieza R1, decisión 403): vídeos de hasta 500 MB como cuerpo crudo, por streaming y sin
        # buffer. El límite global de 50M no cambia; el backend hace cumplir el tope real de cada ruta. Sin reintentos: el
        # cuerpo no se puede volver a mandar. Va antes de /api/ y no toca las rutas de las familias, bajo /api/alumnos.
        location ~ ^/api/material-examen(/|$) {
            limit_req zone=api_limit burst=60 nodelay;
            client_max_body_size 520M;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive connection con backend
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;

            # Una subida lenta o un vídeo en pausa no deben cortarse
            client_body_timeout 600s;
            send_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;

            # Avoid content-encoding transformations on binary content
            gzip off;
            brotli off;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive connection con backend
            proxy_set_header Connection "";

            # Headers for proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;

            # Timeouts extendidos para WiFi
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering mejorado para respuestas grandes
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 24 8k;
            proxy_busy_buffers_size 16k;
            proxy_max_temp_file_size 2048m;

            # Retry automático en errores temporales
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Login endpoint with stricter rate limiting
        location /api/auth/signin {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # OAuth2 authorization endpoints
        location /oauth2/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # OAuth2 requires redirect handling
            proxy_redirect off;
        }

        # OAuth2 callback endpoint
        location /login/oauth2/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # OAuth2 requires redirect handling
            proxy_redirect off;
        }

        # Serve images from backend (proxied to Spring Boot)
        location /imagenes/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive
            proxy_set_header Connection "";

            # Timeouts para archivos grandes
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # Buffers para imágenes grandes
            # Stream large files directly to avoid temp file buffering
            proxy_buffering off;

            # Sin cabeceras de caché propias: manda el backend (public 1h para imágenes públicas,
            # "private, no-store" para fotos de alumnos). No añadir expires/Cache-Control aquí.
        }

        # Serve documents from backend (proxied to Spring Boot)
        location /documentos/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Keepalive
            proxy_set_header Connection "";

            # Timeouts para archivos grandes
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Port $server_port;

            # Buffers para documentos grandes
            # Stream large files directly to avoid temp file buffering
            proxy_buffering off;

            # No caching for documents (security). Se oculta la del backend para que Cache-Control llegue una sola vez.
            proxy_hide_header Cache-Control;
            include /etc/nginx/cabeceras-seguridad.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            default_type text/plain;
        }
