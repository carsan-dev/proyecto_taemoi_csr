<dialog id="imageModal" class="modal" aria-label="Foto ampliada del alumno" (click)="ficha.cerrarModal()">
  <button type="button" class="close" aria-label="Cerrar foto ampliada" (click)="ficha.cerrarModal()">
    <i class="bi bi-x-circle-fill"></i>
  </button>
  <img class="modal-content" id="imgAmpliada" alt="Foto del Alumno" loading="lazy" />
  <div id="caption"></div>
</dialog>
