
      <div
        class="pdf-canvas-viewer"
        [class.is-expanded]="visorExpandido"
        [style.--viewer-top-offset]="visorExpandidoTopOffsetPx + 'px'"
        
        (contextmenu)="onBloquearDescargaContenido($event)"
      >
        <div class="pdf-canvas-toolbar">
          <div class="pdf-toolbar-row">
            <button
              type="button"
              class="pdf-toolbar-btn"
              (click)="irAPaginaAnteriorPdf()"
              [disabled]="paginaActualPdf <= 1 || cargandoPaginaPdf"
            >
              <i aria-hidden="true" class="bi bi-chevron-left"></i>
              Anterior
            </button>
            <span class="pdf-canvas-page" aria-live="polite">P&aacute;gina {{ paginaActualPdf }} / {{ totalPaginasPdf || 1 }}</span>
            <button
              type="button"
              class="pdf-toolbar-btn"
              (click)="irAPaginaSiguientePdf()"
              [disabled]="!totalPaginasPdf || paginaActualPdf >= totalPaginasPdf || cargandoPaginaPdf"
            >
              Siguiente
              <i aria-hidden="true" class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="pdf-toolbar-row pdf-toolbar-row-secondary">
            <button
              type="button"
              class="pdf-toolbar-btn is-icon"
              (click)="reducirZoomPdf()"
              [disabled]="zoomPdf <= 0.75 || cargandoPaginaPdf"
              title="Reducir zoom" aria-label="Reducir zoom"
            >
              <i aria-hidden="true" class="bi bi-zoom-out"></i>
            </button>
            <span class="pdf-canvas-zoom">{{ getZoomPdfPorcentaje() }}%</span>
            <button
              type="button"
              class="pdf-toolbar-btn is-icon"
              (click)="aumentarZoomPdf()"
              [disabled]="zoomPdf >= 2.2 || cargandoPaginaPdf"
              title="Aumentar zoom" aria-label="Aumentar zoom"
            >
              <i aria-hidden="true" class="bi bi-zoom-in"></i>
            </button>
            <button type="button" class="pdf-toolbar-btn pdf-toolbar-btn-full" (click)="toggleVisorExpandido()">
              <i aria-hidden="true" class="bi" [ngClass]="visorExpandido ? 'bi-fullscreen-exit' : 'bi-fullscreen'"></i>
              <span>{{ visorExpandido ? 'Salir' : 'Expandir' }}</span>
            </button>
          </div>
        </div>

        @if (errorVisorPdf) {
        <p class="materials-state is-error" role="alert">{{ errorVisorPdf }}</p>
        }

        <div class="pdf-canvas-wrap">
          <canvas #pdfCanvasRef class="pdf-canvas" role="img" [attr.aria-label]="titulo + ' — página ' + paginaActualPdf" (contextmenu)="onBloquearDescargaContenido($event)"></canvas>
          @if (cargandoPaginaPdf) {
          <div class="pdf-canvas-loading">
            <span>Renderizando documento...</span>
          </div>
          }
        </div>
      </div>
