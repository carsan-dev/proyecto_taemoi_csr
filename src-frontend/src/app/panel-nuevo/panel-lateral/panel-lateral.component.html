<dialog #panel class="pn-panel" [class.pn-panel--hoja]="hoja" [class.pn-panel--sin-velo]="!modal" [style.width.px]="hoja ? null : ancho" [attr.aria-labelledby]="id + '-titulo'"
  [attr.aria-describedby]="descripcion ? id + '-descripcion' : null" (cancel)="alCancelarNativo($event)" (close)="alCerrarNativo()" (click)="alClic($event)"
  (keydown)="alTeclear($event)">
  <div class="pn-panel__caja">
    @if (hoja) {
    <div class="pn-panel__asa" aria-hidden="true"></div>
    }
    <div class="pn-panel__cabecera">
      <div class="pn-panel__titulos">
        <h2 class="pn-panel__titulo" [id]="id + '-titulo'">{{ titulo }}</h2>
        @if (descripcion) {
        <p class="pn-panel__descripcion" [id]="id + '-descripcion'">{{ descripcion }}</p>
        }
      </div>
      <button type="button" class="pn-panel__cerrar" aria-label="Cerrar" [disabled]="bloqueado" (click)="pedirCierre()">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>
    </div>
    <div class="pn-panel__cuerpo">
      <ng-content />
    </div>
    <div class="pn-panel__pie">
      <ng-content select="[pnPie]" />
    </div>
  </div>
</dialog>
