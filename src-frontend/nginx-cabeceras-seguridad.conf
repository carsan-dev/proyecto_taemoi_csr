# Cabeceras de seguridad comunes a todas las respuestas.
#
# Se incluye en el server y, además, en CADA location que declare su propio add_header: en nginx un location con
# algún add_header deja de heredar TODOS los add_header del server (nginx 1.26 no tiene add_header_inherit). Si se
# añade un location con add_header, debe llevar también:  include /etc/nginx/cabeceras-seguridad.conf;
#
# Ruta en el contenedor: /etc/nginx/cabeceras-seguridad.conf (fuera de conf.d, que nginx.conf incluye a nivel http).
# Producción la monta desde docker-compose.production.yml; los Dockerfile la copian para las imágenes locales.
#
# El backend (Spring Security) también manda algunas de estas cabeceras con otros valores (p. ej. HSTS con
# includeSubDomains). Se ocultan para que cada cabecera llegue una sola vez y con el valor de aquí.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;

# HSTS sin includeSubDomains ni preload (decisión 253). En HTTP los navegadores la ignoran.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# "0" y no "1; mode=block": el filtro XSS de los navegadores antiguos está retirado y podía usarse para filtrar
# información entre sitios; la protección real es la CSP. Es el valor que recomienda OWASP y el que manda Spring.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP, por directiva:
# - script-src: 'unsafe-inline' hace falta para los <script> en línea de index.html y para el onload="this.media='all'"
#   que mete Angular al incrustar el CSS crítico (inlineCritical); sin él la hoja de estilos no se aplicaría.
#   googletagmanager.com: gtag.js, solo tras aceptar las cookies de análisis.
# - style-src / font-src: Google Fonts (Angular incrusta el CSS al compilar; las fuentes se descargan de gstatic).
# - img-src: data: y blob: (iconos en línea, miniaturas de logos y firma de preinscripción), píxeles de GA4 y las
#   teselas del mapa de la portada (OpenStreetMap y OpenTopoMap, subdominios a, b y c de Leaflet).
# - connect-src: API en el mismo origen, envío de GA4, y buscador (Nominatim) y rutas (OSRM) del mapa.
# - object-src: 'self' blob: y no 'none'. Los PDF se abren a pantalla completa desde /api o como blob: en otra pestaña
#   (que hereda esta CSP); Chrome los muestra con 'none', pero Safari en iOS (materiales de examen) no se ha podido
#   probar y su visor de PDF puede contar como plugin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://nominatim.openstreetmap.org https://router.project-osrm.org; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
