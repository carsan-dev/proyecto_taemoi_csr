spring.application.name=spring-security
spring.profiles.active=@spring.profiles.active@
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=true

jwt.secret=${JWT_SECRET}
# Clave AES-256 (32 bytes en base64) para cifrar en reposo los datos de salud. Obligatoria: sin ella
# la aplicación no arranca. Generar con: openssl rand -base64 32. Si se pierde, los datos cifrados
# no se pueden recuperar.
app.cifrado.clave=${APP_CIFRADO_CLAVE:}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

server.port=8080
server.error.whitelabel.enabled=false

# Compression Configuration
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# HTTP/2 Support
server.http2.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing-schema
spring.flyway.connect-retries=10
# Guarda de V28: se niega a aplicarse en la misma ejecución de Flyway que V27. Solo los entornos de
# prueba que migran de cero en una ejecución (tests, docker-compose.pruebas.yml, docker-compose.e2e.yml)
# la desactivan con TAEMOI_V28_PERMITIR_MISMO_DESPLIEGUE_QUE_V27=true. En producción, nunca.
spring.flyway.placeholders.v28_permitir_mismo_despliegue_que_v27=${TAEMOI_V28_PERMITIR_MISMO_DESPLIEGUE_QUE_V27:false}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=TaemoiHikariCP

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Carga por lotes (IN de hasta 50) las colecciones y asociaciones perezosas o EAGER por consulta secundaria, en vez de
# una consulta por fila (N+1). No cambia qué se carga ni el JSON; aplica a todos los perfiles (producción y tests).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.banner.location=classpath:taemoi_logo.txt
cors.allowed.origin=${CORS_ALLOWED_ORIGIN}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.servlet.multipart.max-file-size=50MB
spring.mail.default-encoding=UTF-8
spring.mail.from=noreplymoiskimdo@gmail.com
app.mail.from-name=${SPRING_MAIL_FROM_NAME:Moi's Kim Do}
spring.mvc.static-path-pattern=/imagenes/**
# File storage paths - now using environment variables for flexibility
app.imagenes.directorio.linux=${APP_IMAGENES_PATH_DOCKER:/var/www/app/imagenes/}
app.imagenes.directorio.windows=${APP_IMAGENES_PATH:C:/Users/croly/Documents/Desarrollos/proyecto_taemoi_csr/static_resources/imagenes/}
# Carpetas de las que versiones anteriores guardaban en imagen.ruta la ruta ABSOLUTA del fichero (separadas por comas).
# Una ruta absoluta solo se lee o se borra si queda dentro de la carpeta de imágenes o de una de estas; si no, se ignora.
# /var/www/app/imagenes: contenedor (rutas reescritas el 15/10/2026); /opt/taemoi/static_resources/imagenes: host antes
# de Docker; %USERPROFILE%/static_resources/imagenes: valor de Windows de 2024. Una carpeta de menos de 2 segmentos
# (/, C:\, /tmp) se ignora con un aviso.
# APP_IMAGENES_DIRECTORIOS_HEREDADOS SUSTITUYE esta lista: al añadir una carpeta, repite las de por defecto. En el
# servidor va en el .env que lee docker compose: el backend solo recibe las variables de su environment: en
# docker-compose.production.yml, que la pasa con la misma lista de Linux por defecto.
app.imagenes.directorios-heredados=${APP_IMAGENES_DIRECTORIOS_HEREDADOS:/var/www/app/imagenes/,/opt/taemoi/static_resources/imagenes/,%USERPROFILE%/static_resources/imagenes/}
# Orígenes propios a los que la foto de un alumno sin fichero puede redirigir (su URL guardada). Por defecto, la URL
# base de la API y la del frontend: no hace falta definirla. APP_IMAGENES_REDIRECCION_ORIGENES SUSTITUYE esa lista
# (repite los orígenes por defecto si añades uno) y, como la anterior, en el servidor va en el .env que lee docker
# compose; docker-compose.production.yml la pasa por defecto con APP_BASE_URL y https://moiskimdo.es.
# app.imagenes.redireccion.origenes=https://moiskimdo.es
app.documentos.directorio.linux=${APP_DOCUMENTOS_PATH_DOCKER:/var/www/app/documentos/}
app.documentos.directorio.windows=${APP_DOCUMENTOS_PATH:C:/Users/croly/Documents/Desarrollos/proyecto_taemoi_csr/static_resources/documentos/}
app.base.url=http://localhost:8080
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}

# Logging Configuration
# Suppress PDFBox font warnings for corrupted system fonts
logging.level.org.apache.pdfbox.pdmodel.font=ERROR
logging.level.org.apache.fontbox=ERROR

# Auditoria global (cada 12 meses actualmente)
audit.retention.months=12
audit.retention.cleanup-cron=0 15 3 * * *

# Recordatorios de racha diaria
streak.reminder.enabled=true
streak.reminder.window-hours=3
streak.reminder.cron=0 */10 * * * *

# Multi-escuela: organizacion usada cuando no hay ninguna fijada (peticiones, arranque). 1 = Taemoi
app.organizacion.por-defecto=${APP_ORGANIZACION_POR_DEFECTO:1}
